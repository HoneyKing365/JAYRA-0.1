appId: com.jayra.desktop
productName: JAYRA
copyright: Copyright © 2026 JAYRA
afterPack: electron/afterPack.cjs

directories:
  output: release
  buildResources: build

# The backend runs as a separate Node process that serves static files and
# reads modules from disk, so we keep the app unpacked (no asar) to guarantee
# those paths resolve identically to development.
asar: false

files:
  - electron/**/*
  - dist/**/*
  - assets/**/*
  - build/icon.png
  - build/icon.ico
  - build/icon_vector.png
  - build/icon_vector.ico
  - package.json

# The PyInstaller-frozen desktop agent (embeds its own Python runtime) is copied
# verbatim into resources/agent, so the target machine needs no Python.
extraResources:
  - from: agent_dist/myraa-agent
    to: agent
    filter: ["**/*"]

win:
  icon: build/icon_vector.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JAYRA
  # Installer output: JAYRA-0.1-Setup.exe
  artifactName: ${productName}-${version}-Setup.${ext}

portable:
  artifactName: ${productName}-${version}-Portable.${ext}
