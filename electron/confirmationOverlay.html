<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAYRA Action Authorization</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        user-select: none;
      }
      .card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 24px;
        border-radius: 18px;
        background: rgba(14, 16, 24, 0.94);
        border: 1px solid rgba(245, 158, 11, 0.35);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(245, 158, 11, 0.15);
        backdrop-filter: blur(16px);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
        cursor: grab;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(245, 158, 11, 0.2);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.4);
      }
      .countdown {
        font-size: 12px;
        font-family: monospace;
        color: #94a3b8;
      }
      .body {
        margin-top: 12px;
        flex: 1;
        overflow-y: auto;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .desc {
        font-size: 12px;
        color: #cbd5e1;
        line-height: 1.45;
        margin-bottom: 10px;
      }
      .details-box {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 11px;
        font-family: monospace;
        color: #94a3b8;
        max-height: 70px;
        overflow-y: auto;
        word-break: break-all;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 14px;
        -webkit-app-region: no-drag;
      }
      button {
        font-size: 12px;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.15s ease;
        outline: none;
      }
      .btn-deny {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #e2e8f0;
      }
      .btn-deny:hover {
        background: rgba(239, 68, 68, 0.25);
        border-color: rgba(239, 68, 68, 0.5);
        color: #fca5a5;
      }
      .btn-allow {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(217, 119, 6, 0.4));
        border: 1px solid rgba(245, 158, 11, 0.6);
        color: #fef3c7;
        box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
      }
      .btn-allow:hover {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.45), rgba(217, 119, 6, 0.6));
        border-color: #fbbf24;
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
      }
      .progress-bar-bg {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        margin-top: 10px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: #f59e0b;
        width: 100%;
        transition: width 1s linear;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="brand">
          <span class="badge" id="riskBadge">Action Required</span>
        </div>
        <div class="countdown" id="countdownLabel">45s</div>
      </div>
      
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="body">
        <div class="title" id="actionTitle">JAYRA Confirmation</div>
        <div class="desc" id="actionDesc">A background autonomous action requires your explicit permission to execute.</div>
        <div class="details-box" id="actionDetails" style="display: none;"></div>
      </div>

      <div class="footer">
        <button class="btn-deny" id="btnDeny" type="button">Deny / Cancel</button>
        <button class="btn-allow" id="btnAllow" type="button">Authorize & Run</button>
      </div>
    </div>

    <script>
      let confirmationId = null;
      let totalSeconds = 45;
      let secondsLeft = 45;
      let countdownTimer = null;

      function updateUI(data) {
        if (!data) return;
        confirmationId = data.id;

        const titleEl = document.getElementById('actionTitle');
        const descEl = document.getElementById('actionDesc');
        const detailsEl = document.getElementById('actionDetails');
        const badgeEl = document.getElementById('riskBadge');

        if (titleEl && data.title) titleEl.textContent = data.title;
        if (descEl && data.description) descEl.textContent = data.description;

        if (badgeEl && data.capability) {
          badgeEl.textContent = data.capability.toUpperCase();
        }

        if (detailsEl) {
          if (data.details && Object.keys(data.details).length > 0) {
            detailsEl.textContent = JSON.stringify(data.details, null, 2);
            detailsEl.style.display = 'block';
          } else {
            detailsEl.style.display = 'none';
          }
        }

        if (data.expiresAt) {
          const expMs = Date.parse(data.expiresAt);
          if (!isNaN(expMs)) {
            secondsLeft = Math.max(1, Math.round((expMs - Date.now()) / 1000));
            totalSeconds = secondsLeft;
          }
        }

        startCountdown();
      }

      function startCountdown() {
        if (countdownTimer) clearInterval(countdownTimer);
        const countdownEl = document.getElementById('countdownLabel');
        const progressEl = document.getElementById('progressBar');

        const tick = () => {
          if (countdownEl) countdownEl.textContent = `${secondsLeft}s`;
          if (progressEl && totalSeconds > 0) {
            const pct = Math.max(0, (secondsLeft / totalSeconds) * 100);
            progressEl.style.width = `${pct}%`;
          }

          if (secondsLeft <= 0) {
            clearInterval(countdownTimer);
            if (window.overlayApi) window.overlayApi.resolve(confirmationId, false);
          }
          secondsLeft--;
        };

        tick();
        countdownTimer = setInterval(tick, 1000);
      }

      document.getElementById('btnAllow').addEventListener('click', () => {
        if (countdownTimer) clearInterval(countdownTimer);
        if (window.overlayApi) {
          window.overlayApi.resolve(confirmationId, true);
        }
      });

      document.getElementById('btnDeny').addEventListener('click', () => {
        if (countdownTimer) clearInterval(countdownTimer);
        if (window.overlayApi) {
          window.overlayApi.resolve(confirmationId, false);
        }
      });

      if (window.overlayApi) {
        window.overlayApi.onData((data) => updateUI(data));
      }
    </script>
  </body>
</html>
